# Local Postgres (Cloud SQL in the cloud) and a local Google Cloud Storage (task 057) for development.
# Start both with: pnpm db:up
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Files (task 057): fake-gcs-server speaks the GCS JSON and XML APIs; it doesn't check signatures. The
  # dev bucket comes from /data/<bucket>. Browsers upload straight to it, so CORS is open.
  storage:
    image: fsouza/fake-gcs-server:1.52.2
    command: ["-scheme", "http", "-port", "4443", "-public-host", "localhost:4443", "-external-url", "http://localhost:4443", "-data", "/data", "-cors-headers", "Content-Type,Content-Disposition"]
    ports:
      - "4443:4443"
    volumes:
      - storagedata:/storage
      - ./packages/storage/dev-bucket:/data

volumes:
  dbdata:
  storagedata:
