name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build-storybook
      # Deploy names per environment (task 068); no GCP access.
      - run: bash infra/scripts/test-environment.sh

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    # A normal run takes 4–8 minutes; a stalled apt mirror once hung it for 6 hours.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      STORAGE_BUCKET: app-files
      STORAGE_LOCAL_URL: http://localhost:4443
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
        timeout-minutes: 10
      - run: pnpm build
      - run: pnpm db:migrate
      # Row-level security against the migrated database (task 047).
      - run: pnpm --filter @repo/db test:db
      # The deploy's database scripts (task 068): runtime role check, preview logins, migration lock, and the
      # whole sequence on Cloud SQL-like databases. One file at a time: they alter app_user in rolled-back
      # transactions.
      - run: >-
          node --experimental-strip-types --test --test-concurrency=1
          infra/scripts/check-runtime-role.test.mjs infra/scripts/provision-db-logins.test.mjs
          infra/scripts/with-db-lock.test.mjs
      - run: bash infra/scripts/test-preview-migrate.sh
      # Files (task 057): the same local storage server as docker-compose.yml. Service containers can't take
      # its flags, so it starts here.
      - run: >-
          docker run -d --name storage -p 4443:4443 -v "$PWD/packages/storage/dev-bucket:/data"
          fsouza/fake-gcs-server:1.52.2 -scheme http -port 4443 -public-host localhost:4443
          -external-url http://localhost:4443 -data /data -cors-headers Content-Type,Content-Disposition,x-goog-if-generation-match
          && timeout 30 sh -c 'until curl -sf http://localhost:4443/storage/v1/b >/dev/null; do sleep 1; done'
      - run: pnpm --filter @repo/storage test:storage
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
