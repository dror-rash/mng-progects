name: Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # Workload Identity Federation
  pull-requests: write # post preview URL

concurrency:
  group: deploy-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/app
  CLOUDSQL_CONNECTION: ${{ vars.GCP_CLOUDSQL_CONNECTION }}
  APP_URL: ${{ vars.APP_URL }}
  IS_PR: ${{ github.event_name == 'pull_request' }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  deploy:
    # Fork PRs can't get OIDC tokens; skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3

      # 0) Database migrations (previews migrate app_preview, main migrates app)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @repo/db... --filter @repo/e2e...
      # Names per environment (database, logins, secrets) come from infra/scripts/environment.sh only.
      - name: Migrate, provision database logins, check the runtime role
        run: |
          . infra/scripts/environment.sh
          curl -fsSL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 "$CLOUDSQL_CONNECTION" > proxy.log 2>&1 &
          for i in $(seq 1 20); do (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null && break; sleep 1; done

          secret() { gcloud secrets versions access latest --secret="$1"; }
          OWNER_PASSWORD="$(secret "$DB_OWNER_PASSWORD_SECRET")"; echo "::add-mask::$OWNER_PASSWORD"
          PREVIEW_PASSWORD="$(secret "$PREVIEW_DB_PASSWORD_SECRET")"; echo "::add-mask::$PREVIEW_PASSWORD"
          RUNTIME_PASSWORD="$(secret "$DB_PASSWORD_SECRET")"; echo "::add-mask::$RUNTIME_PASSWORD"
          as_owner() { echo "postgres://${DB_OWNER_LOGIN}:${OWNER_PASSWORD}@127.0.0.1:5432/$1"; }

          # Migrations run as the owner login on this environment's database.
          DATABASE_URL="$(as_owner "$DB_NAME")" pnpm db:migrate
          # The preview login and CONNECT on the main database (idempotent, every deploy).
          DATABASE_URL="$(as_owner "$MAIN_DB_NAME")" PREVIEW_DB_PASSWORD="$PREVIEW_PASSWORD" \
            node --experimental-strip-types --no-warnings infra/scripts/provision-db-logins.mjs
          # As this environment's runtime login with `-c role=app_user`: fails the deploy unless row-level
          # security really applies (ADR-0006: it isn't forced).
          DATABASE_URL="postgres://${DB_LOGIN}:${RUNTIME_PASSWORD}@127.0.0.1:5432/${DB_NAME}" \
            node --experimental-strip-types --no-warnings infra/scripts/check-runtime-role.mjs
          kill %1 || true

      # 1) example-zone and dashboard first: the shell needs their URLs at build time
      - name: Build & push example-zone
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP=example-zone
          tags: ${{ env.REGISTRY }}/example-zone:${{ github.sha }}
          cache-from: type=gha,scope=example-zone
          cache-to: type=gha,scope=example-zone,mode=max
      - name: Deploy example-zone
        run: infra/scripts/deploy-service.sh example-zone "$REGISTRY/example-zone:${{ github.sha }}"
      - name: Resolve example-zone URL
        id: example
        run: echo "url=$(infra/scripts/service-url.sh example-zone)" >> "$GITHUB_OUTPUT"

      - name: Build & push dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP=dashboard
          tags: ${{ env.REGISTRY }}/dashboard:${{ github.sha }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max
      - name: Deploy dashboard
        run: infra/scripts/deploy-service.sh dashboard "$REGISTRY/dashboard:${{ github.sha }}"
      - name: Resolve dashboard URL
        id: dashboard
        run: echo "url=$(infra/scripts/service-url.sh dashboard)" >> "$GITHUB_OUTPUT"

      # 2) shell, pointed at those revisions (tagged pr-<N> URLs on PRs)
      - name: Check zone URLs
        env:
          EXAMPLE_URL: ${{ steps.example.outputs.url }}
          DASHBOARD_URL: ${{ steps.dashboard.outputs.url }}
        run: |
          for url in "$EXAMPLE_URL" "$DASHBOARD_URL"; do
            case "$url" in https://?*) ;; *) echo "::error::A zone URL is missing (got '$url')"; exit 1 ;; esac
          done
      - name: Build & push shell
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP=shell
            EXAMPLE_ZONE_URL=${{ steps.example.outputs.url }}
            DASHBOARD_ZONE_URL=${{ steps.dashboard.outputs.url }}
          tags: ${{ env.REGISTRY }}/shell:${{ github.sha }}
          cache-from: type=gha,scope=shell
          cache-to: type=gha,scope=shell,mode=max
      - name: Deploy shell
        run: infra/scripts/deploy-service.sh shell "$REGISTRY/shell:${{ github.sha }}"
      - name: Resolve shell URL
        id: shell
        run: echo "url=$(infra/scripts/service-url.sh shell)" >> "$GITHUB_OUTPUT"
      # An empty BASE_URL would make Playwright start local servers instead of testing the preview.
      - name: Check shell URL
        env:
          SHELL_URL: ${{ steps.shell.outputs.url }}
        run: |
          case "$SHELL_URL" in https://?*) ;; *) echo "::error::The shell URL is missing (got '$SHELL_URL')"; exit 1 ;; esac

      # 3) Acceptance tests against the deployed preview: the @smoke set only. The full suite needs
      #    AUTH_DISABLE_RATE_LIMIT, which a deployment never sets (rule 13). One worker: the set signs up and
      #    logs in from one runner IP, against production rate limits. The report and traces stay on the
      #    runner: the repository is public, and failed traces hold the throwaway accounts' passwords and
      #    cookies.
      - if: env.IS_PR == 'true'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
        timeout-minutes: 10
      - name: Run Playwright @smoke against preview
        if: env.IS_PR == 'true'
        working-directory: e2e
        run: pnpm exec bddgen && pnpm exec playwright test --workers=1 --trace=off
        env:
          BASE_URL: ${{ steps.shell.outputs.url }}
          E2E_TAGS: "@smoke"
      - name: Comment preview URL
        if: env.IS_PR == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none \
            --body "Preview: ${{ steps.shell.outputs.url }} (commit ${GITHUB_SHA::7})"
